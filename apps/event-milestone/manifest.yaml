gdn: 1
id: event-milestone
version: 0.1.0
name: Event Milestone
author: ShulinZhou
description: Days to your wedding, birthday, graduation or other milestone, with themed pixel art and a count colour you choose.
category: Lifestyle
entry: app.star

width: 192
height: 32
refresh: 21600

pages: [since]

inputs:
  - key: event
    type: string
    app_input_type: free-text
    label: Event name
    default: "WEDDING"
    help: "Completes the title: DAYS TO ___. Leave blank to use the theme name."
  - key: date
    type: string
    app_input_type: date
    label: Event date
    default: "2026-12-31"
    help: The day it happens - counts DAYS TO it, then TODAY on the day.
  - key: theme
    type: choice
    app_input_type: dropdown
    label: Event theme
    default: Wedding
    choices:
      # Life events
      - Wedding
      - Birthday
      - Graduation
      - Girl
      - Boy
      - House
      - Fireworks
      # Travel
      - Departure
      - Arrival
      - Car
      - Yacht
      - Helicopter
      # Places
      - Beach
      - Mountains
      - "Torii Gate"
      - Pagoda
      - Castle
      # Outdoors
      - Tree
      - Flower
      - Campfire
      - Tent
      - Fishing
      - Paraglider
      - Bicycle
      # Awards
      - "Gold Medal"
      - Trophy
      # Sports
      - Running
      - Soccer
      - Football
      - Basketball
      - Volleyball
      - Badminton
      - Hockey
      - Skiing
      - Golf
      - Chess
      # Flags
      - China
      - USA
      - Russia
      - UK
      - France
      - Germany
      - Japan
      - Brazil
      - India
      - Italy
      - UAE
      - Canada
      - Australia
  - key: numcolor
    type: choice
    app_input_type: dropdown
    label: Event color
    default: Pink
    choices: [Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White]
    help: The colour of the event's name and day count.

  - key: accent
    type: choice
    app_input_type: dropdown
    label: Accent color
    default: Purple
    choices: [Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White]
    help: The edge rail.
