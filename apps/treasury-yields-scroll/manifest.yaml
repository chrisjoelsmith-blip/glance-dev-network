gdn: 1
id: treasury-yields-scroll
version: 0.1.0
name: Treasury Yields (Scroll)
author: glance-led-dev
description: The daily yield on the US Treasury bond you pick, with the day's move in basis points, thirty days of history, and the full yield curve. Keyless, from treasury.gov.
category: Finance
entry: app.star

width: 192
height: 32
# treasury.gov posts once a business day, so hourly is the fastest a
# refresh can ever show something new; the fetch ttl matches.
refresh: 3600

pages: [yield_page, curve_page]

inputs:
  - key: tenor
    type: choice
    app_input_type: dropdown
    label: Bond to follow
    default: "10 YEAR"
    help: Which US Treasury maturity to show. The 10 year is the benchmark most people mean by "the bond yield"; the 2 year tracks Fed expectations; the 30 year is the long bond.
    choices:
      - "1 MONTH"
      - "2 MONTH"
      - "3 MONTH"
      - "6 MONTH"
      - "1 YEAR"
      - "2 YEAR"
      - "3 YEAR"
      - "5 YEAR"
      - "7 YEAR"
      - "10 YEAR"
      - "20 YEAR"
      - "30 YEAR"
