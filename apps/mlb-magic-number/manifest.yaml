gdn: 1
id: mlb-magic-number
version: 0.1.0
name: MLB Magic Number
author: John McRae
description: One team's magic number (or elimination number) to clinch, with the club mark. Pick any MLB team.
category: Sports
entry: app.star

width: 128
height: 32
# Standings move when games become Final; 5 min keeps the combo number current.
refresh: 3600

pages: [main]

